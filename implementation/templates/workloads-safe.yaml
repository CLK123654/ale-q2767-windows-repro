apiVersion: v1
kind: Pod
metadata:
  name: cache-writer
  namespace: build-shared
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: cache
      image: example.invalid/cache-writer:1.4
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 10001
---
apiVersion: v1
kind: Pod
metadata:
  name: test-runner
  namespace: build-shared
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: runner
      image: example.invalid/test-runner:3.2
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsUser: 10001
      volumeMounts:
        - name: workspace
          mountPath: /workspace
  volumes:
    - name: workspace
      emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: artifact-signer
  namespace: build-signed
spec:
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: signer
      image: example.invalid/artifact-signer:2.7
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
---
apiVersion: v1
kind: Pod
metadata:
  name: buildkit-builder
  namespace: buildkit-system
spec:
  runtimeClassName: legacy-buildkit
  containers:
    - name: builder
      image: example.invalid/buildkit:0.19
      securityContext:
        privileged: true
---
apiVersion: v1
kind: Pod
metadata:
  name: vendor-agent
  namespace: legacy-vendor
spec:
  containers:
    - name: agent
      image: example.invalid/vendor-agent:6.1
      securityContext:
        allowPrivilegeEscalation: true
